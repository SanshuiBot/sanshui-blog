name: Deploy Next.js site to Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install system fonts（OG 图片中文渲染依赖）
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji

      - name: Install dependencies
        run: npm ci

      # Next.js 构建缓存（.next/cache）：webpack 构建产物缓存，重复构建大幅提速。
      # key 含 package-lock + 内容 hash——依赖或文章变化才重建；restore-keys 部分命中兜底。
      # 注意：.next/ 整体是 gitignore 的，这里只缓存 cache 子目录，out/ 是部署产物不缓存。
      # actions/cache 最新标签是 v4（v5+ 不存在，勿升级）。
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('content/posts/**', 'content/resume.md') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            nextjs-${{ runner.os }}-

      # 质量门禁：构建不跑 lint（AGENTS.md #8），这里单独补上。
      # 三个门禁按顺序执行；lint/test 加 if: always()：即使前一步失败也会跑完，
      # 一次 CI 能看到全部失败。Build 用默认 success() 条件，任一门禁失败即跳过部署。
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        if: always()
        run: npm run lint

      - name: Test
        if: always()
        run: npm run test

      - name: Build with Next.js
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
