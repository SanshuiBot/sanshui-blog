<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="三水">
  <defs>
    <linearGradient id="aurora-w" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>
  <!-- 米白背景 -->
  <rect width="100" height="100" rx="24" fill="#f9f7f1"/>
  <!-- 三片花瓣，围绕中心旋转 -->
  <g transform="translate(50,50)">
    <ellipse cx="0" cy="-18" rx="10" ry="18" fill="url(#aurora-w)" opacity="0.7" transform="rotate(0)"/>
    <ellipse cx="0" cy="-18" rx="10" ry="18" fill="url(#aurora-w)" opacity="0.7" transform="rotate(120)"/>
    <ellipse cx="0" cy="-18" rx="10" ry="18" fill="url(#aurora-w)" opacity="0.7" transform="rotate(240)"/>
  </g>
  <!-- 中心圆 -->
  <circle cx="50" cy="50" r="8" fill="#f9f7f1"/>
  <circle cx="50" cy="50" r="5" fill="url(#aurora-w)" opacity="0.9"/>
</svg>
