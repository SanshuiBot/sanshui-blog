<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="三水">
  <defs>
    <!-- 极光渐变：紫 → 粉 → 青 -->
    <linearGradient id="aurora" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#ff6ec7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <!-- 背景径向光晕 -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141420"/>
      <stop offset="100%" stop-color="#05050a"/>
    </radialGradient>
  </defs>

  <!-- 深色圆角方底 -->
  <rect width="100" height="100" rx="24" fill="url(#bgGlow)"/>

  <!-- 三条流动水波：从左下到右上，y 递增错落 -->
  <!-- 水波 1（顶，最细最亮） -->
  <path d="M 12 34 C 32 34, 42 46, 62 46 S 88 38, 88 38"
        fill="none" stroke="url(#aurora)" stroke-width="6"
        stroke-linecap="round" opacity="0.95"/>
  <!-- 水波 2（中，主视觉） -->
  <path d="M 12 50 C 32 50, 42 62, 62 62 S 88 54, 88 54"
        fill="none" stroke="url(#aurora)" stroke-width="7"
        stroke-linecap="round" opacity="1"/>
  <!-- 水波 3（底，稍淡） -->
  <path d="M 12 66 C 32 66, 42 78, 62 78 S 88 70, 88 70"
        fill="none" stroke="url(#aurora)" stroke-width="6"
        stroke-linecap="round" opacity="0.85"/>
</svg>
