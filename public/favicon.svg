<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="三水">
  <defs>
    <!-- 极光渐变：紫 → 粉 → 青 -->
    <linearGradient id="aurora" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#ff6ec7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <!-- 背景径向光晕 -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#141420"/>
      <stop offset="100%" stop-color="#05050a"/>
    </radialGradient>
    <!-- 圆角裁切：让波纹超出部分被干净切掉 -->
    <clipPath id="roundClip">
      <rect width="100" height="100" rx="24"/>
    </clipPath>
  </defs>

  <!-- 深色圆角方底 -->
  <rect width="100" height="100" rx="24" fill="url(#bgGlow)"/>

  <!-- 三条流动水波：与 public/logo.svg 同步，整体上移 5px（相对原始版本）
       y 坐标：顶 33 / 中 47 / 底 61，与导航栏 logo 视觉重心完全一致 -->
  <g clip-path="url(#roundClip)">
    <!-- 水波 1（顶，紫粉） -->
    <path d="M 20 33 C 36 33, 44 43, 60 43 S 80 37, 80 37"
          fill="none" stroke="url(#aurora)" stroke-width="5.5"
          stroke-linecap="round" opacity="0.95"/>
    <!-- 水波 2（中，粉青，主视觉） -->
    <path d="M 20 47 C 36 47, 44 57, 60 57 S 80 51, 80 51"
          fill="none" stroke="url(#aurora)" stroke-width="6.5"
          stroke-linecap="round" opacity="1"/>
    <!-- 水波 3（底，紫青） -->
    <path d="M 20 61 C 36 61, 44 71, 60 71 S 80 65, 80 65"
          fill="none" stroke="url(#aurora)" stroke-width="5.5"
          stroke-linecap="round" opacity="0.85"/>
  </g>
</svg>
